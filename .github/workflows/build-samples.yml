# Builds every Better Together sample into a WebAssembly component using the
# pinned `better-together-tools` image, then (on pushes to main) publishes each
# component to the GitHub Container Registry as an OCI artifact via `wkg`.
#
# Distributing components over OCI registries:
#   https://opensource.microsoft.com/blog/2024/09/25/distributing-webassembly-components-using-oci-registries/
#   https://component-model.bytecodealliance.org/composing-and-distributing/distributing.html
name: build-samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The toolchain image produced by the `build-tools-image` workflow.
  TOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/better-together-tools:latest
  # OCI namespace the components are published under: ghcr.io/<owner>/better-together/<sample>.
  COMPONENT_NAMESPACE: ${{ github.repository_owner }}/better-together

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Run every step inside the pinned toolchain image so CI compiles the
    # samples with exactly the tools validated in `build-tools-image`.
    container:
      image: ghcr.io/${{ github.repository_owner }}/better-together-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build all samples
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/build-all.sh

      - name: Upload components
        uses: actions/upload-artifact@v7
        with:
          name: components
          path: dist/*.wasm
          if-no-files-found: error

      # Publish only from pushes to main — not from pull requests.
      - name: Publish components to GHCR (OCI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Force bash: the container's default shell is dash, which lacks the
        # `${VAR::N}` substring expansion used below.
        shell: bash
        env:
          WKG_OCI_USERNAME: ${{ github.actor }}
          WKG_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          namespace="$(echo "${COMPONENT_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          sha_tag="sha-${GITHUB_SHA::12}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          failed=()
          for sample in ferris corro khaos gopher; do
            ref="${REGISTRY}/${namespace}/${sample}"
            readme="samples/${sample}/README.md"
            # OCI annotation values cannot contain newlines/tabs/CR (registries
            # reject the manifest), and GHCR shows `description` as a single
            # line of plain text. So derive a one-line summary from the
            # sample's own README: flatten its leading blockquote tagline,
            # falling back to the first H1 heading. Strip CR first because the
            # README files use CRLF line endings.
            content="$(tr -d '\r' < "${readme}")"
            title="$(printf '%s\n' "${content}" | sed -n 's/^# *//p' | head -n1)"
            description="$(printf '%s\n' "${content}" | awk '
              /^>/  { f=1; line=$0; sub(/^> ?/, "", line);
                      buf = buf (buf=="" ? "" : " ") line; next }
              f && !/^>/ { exit }
              END { print buf }')"
            [ -n "${description}" ] || description="${title}"
            annotations=(
              --annotation "org.opencontainers.image.title=${title}"
              --annotation "org.opencontainers.image.source=${source_url}"
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}"
              --annotation "org.opencontainers.image.description=${description}"
            )
            echo "==> publishing ${ref} (tags: latest, ${sha_tag})"
            if wkg oci push "${annotations[@]}" "${ref}:${sha_tag}" "dist/${sample}.wasm" \
              && wkg oci push "${annotations[@]}" "${ref}:latest" "dist/${sample}.wasm"; then
              echo "    ${sample}: OK"
            else
              echo "::error::failed to publish ${sample} to ${ref}"
              failed+=("${sample}")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::OCI publish failed for: ${failed[*]}"
            exit 1
          fi
