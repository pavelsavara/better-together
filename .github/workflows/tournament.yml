# Tournament Engine — the change-gated hourly run (docs/architecture.md §4.1).
#
# Each tick does a cheap conditional OCI manifest check per active bot; a bot
# whose digest changed (or a new submission) is ingested — its fresh .wasm is
# pulled and re-cached — then ~500 matches seat the changed bot(s), the
# leaderboard + VFS + match logs update, and a SINGLE commit lands on gh-pages.
# If nothing changed the tick exits without committing.
name: tournament

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: write
  packages: read # authenticated GHCR pulls for the OCI manifest check + component pull

concurrency:
  # Single-writer discipline: only one tournament run writes scores/vfs/logs.
  group: store-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (engine)
        uses: actions/checkout@v6

      - name: Checkout gh-pages (data store)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install engine deps
        working-directory: game
        run: npm ci

      - name: Run tournament tick
        working-directory: game
        env:
          STORE_DIR: ${{ github.workspace }}/gh-pages
          # A run-level master seed; stored in each match log for replay.
          MASTER_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
          # Authenticated registry pulls: raises the GHCR rate limit and allows
          # private same-org packages. Public images pull fine without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-wasm-jspi src/run-tournament.ts

      - name: Commit results to gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "better-together-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data matches vfs wasm
            git commit -m "tournament: run ${{ github.run_id }}"
            git push origin gh-pages
          else
            echo "no changes — nothing committed"
          fi
