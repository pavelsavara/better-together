# Validation Action — runs when a maintainer adds the `approved` label to a
# "Submit a gardener" issue. It pulls the component (OCI ref or direct .wasm
# URL), validates it inside the jsco sandbox (game/src/validate), processes the
# avatar, then comments, labels, and commits the registry change to gh-pages.
#
# The smoke match needs >= 3 filler components; these are pulled by OCI ref
# (FILLER_OCI) from the samples published by build-samples.yml, authenticated to
# GHCR with the workflow token.
name: validate-bot

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: read

concurrency:
  # Single-writer discipline: only one validator touches index.json/wasm/icons.
  group: store-writer
  cancel-in-progress: false

jobs:
  validate:
    # Only run for the `approved` label (when wired to the issues event).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (engine + samples)
        uses: actions/checkout@v6

      - name: Checkout gh-pages (data store)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install engine deps
        working-directory: game
        run: npm ci

      - name: Compute filler OCI refs
        id: fillers
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ns="ghcr.io/${owner}/better-together"
          echo "refs=${ns}/corro:latest,${ns}/nib:latest,${ns}/gopher:latest" >> "$GITHUB_OUTPUT"

      - name: Resolve issue author
        id: issue
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v9
        with:
          script: |
            // Read the GitHub API about the submission issue: the author credit
            // for the bot is the issue author's handle, not a form field.
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });
            core.setOutput('author', issue.user.login);
            core.setOutput('number', String(issue.number));

      - name: Run validator
        id: validate
        working-directory: game
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number || github.event.issue.number }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author || github.event.issue.user.login }}
          APPROVER: ${{ github.actor }}
          STORE_DIR: ${{ github.workspace }}/gh-pages
          VALIDATION_COMMENT_FILE: ${{ github.workspace }}/validation-comment.md
          # Three published sample components fill the smoke-match roster
          # (>= 3 required), pulled via the OCI puller using GHCR_TOKEN below.
          FILLER_OCI: ${{ steps.fillers.outputs.refs }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-wasm-jspi src/validate/run-validate.ts

      - name: Comment outcome on the issue
        if: ${{ always() && github.event_name == 'issues' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/validation-comment.md`, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            const label = '${{ steps.validate.outputs.outcome }}' === 'accepted' ? 'accepted' : 'rejected';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
            // An accepted bot is admitted to the registry, so the submission is
            // done — close the issue as completed.
            if (label === 'accepted') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Commit registry change to gh-pages
        if: ${{ steps.validate.outputs.outcome == 'accepted' }}
        working-directory: gh-pages
        run: |
          git config user.name "better-together-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/index.json wasm icons
          git commit -m "validate: admit bot from issue #${{ github.event.issue.number }}"
          git push origin gh-pages
