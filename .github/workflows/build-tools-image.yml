# Builds the WebAssembly component build toolchain image and publishes it to
# the GitHub Container Registry (GHCR). The image is consumed by the
# `build-samples` workflow to compile every sample identically in CI.
name: build-tools-image

on:
  push:
    branches: [main]
    paths:
      - ".github/docker/**"
      - ".github/workflows/build-tools-image.yml"
      - ".dockerignore"
      - "samples/*/Cargo.toml"
      - "samples/*/Cargo.lock"
  pull_request:
    paths:
      - ".github/docker/**"
      - ".github/workflows/build-tools-image.yml"
      - ".dockerignore"
      - "samples/*/Cargo.toml"
      - "samples/*/Cargo.lock"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/better-together-tools

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate / push for non-PR events (PRs from forks can't push).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Context is the repo root so the Dockerfile can COPY the sample
          # dependency manifests/lockfiles it uses to warm the Rust caches.
          context: .
          file: .github/docker/Dockerfile
          # PRs build to validate the Dockerfile but do not push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
